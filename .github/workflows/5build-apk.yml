name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          JAVA_VERSION_OUTPUT="$(java -version 2>&1)"
          echo "$JAVA_VERSION_OUTPUT"

          RAW_VERSION="$(printf '%s\n' "$JAVA_VERSION_OUTPUT" | sed -n 's/.*version "\([^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$RAW_VERSION" ]]; then
            echo "::error::Failed to detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "$RAW_VERSION" == 1.* ]]; then
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f2)"
          else
            MAJOR_VERSION="$(printf '%s' "$RAW_VERSION" | cut -d. -f1 | sed 's/[^0-9].*$//')"
          fi

          if [[ ! "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION}."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail

          KEYSTORE_PATH="./debug.keystore"
          if [[ -f "$KEYSTORE_PATH" ]]; then
            echo "Existing ./debug.keystore detected; skipping generation."
          else
            KEYTOOL_BIN="${JAVA_HOME:+${JAVA_HOME}/bin/keytool}"
            if [[ -z "${KEYTOOL_BIN:-}" || ! -x "$KEYTOOL_BIN" ]]; then
              KEYTOOL_BIN="$(command -v keytool || true)"
            fi
            if [[ -z "${KEYTOOL_BIN:-}" ]]; then
              echo "::error::keytool was not found in the configured Java 17 installation."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              >/dev/null 2>&1 || {
                echo "::error::Failed to generate temporary ./debug.keystore."
                exit 1
              }
          fi

          if [[ ! -f "$KEYSTORE_PATH" || ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::Temporary ./debug.keystore does not exist or is empty after generation."
            exit 1
          fi

          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          APK_SEARCH_DIR="app/build/outputs/apk"

          if [[ ! -e "$EXPECTED_APK" ]]; then
            echo "::error::Expected debug APK was not found at ${EXPECTED_APK}."
            if [[ -d "$APK_SEARCH_DIR" ]]; then
              echo "APK files discovered inside ${APK_SEARCH_DIR}:"
              FOUND_APKS="$(find "$APK_SEARCH_DIR" -type f -name '*.apk' | sort || true)"
              if [[ -n "$FOUND_APKS" ]]; then
                printf '%s\n' "$FOUND_APKS"
              else
                echo "(none)"
              fi
            else
              echo "Directory ${APK_SEARCH_DIR} does not exist."
            fi
            exit 1
          fi

          if [[ ! -f "$EXPECTED_APK" ]]; then
            echo "::error::${EXPECTED_APK} exists but is not a regular file."
            exit 1
          fi

          if [[ ! -s "$EXPECTED_APK" ]]; then
            echo "::error::${EXPECTED_APK} is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::${EXPECTED_APK} does not have the .apk extension."
            exit 1
          fi

          APK_SIZE_BYTES="$(wc -c < "$EXPECTED_APK" | tr -d ' ')"
          echo "Verified debug APK: ${EXPECTED_APK} (${APK_SIZE_BYTES} bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$SOURCE_APK" || ! -s "$SOURCE_APK" || "$SOURCE_APK" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid: ${SOURCE_APK}"
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(
            printf '%s' "$RAW_REPO_NAME" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[._-]+//; s/[._-]+$//'
          )"
          if [[ -z "$SAFE_REPO_NAME" ]]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-asset.XXXXXX")"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [[ ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset validation failed: ${ASSET_PATH}"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_NAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "$GITHUB_OUTPUT"

          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi
          gh --version

          if [[ -z "${ASSET_PATH:-}" || ! -f "$ASSET_PATH" || ! -s "$ASSET_PATH" || "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release APK asset is missing or invalid; aborting release creation."
            exit 1
          fi

          RELEASE_NOTES="$(cat <<EOF
          Automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Asset Filename:** ${ASSET_NAME}

          > **Note:** This APK is intended for testing only. It is not a Play Store production release and is signed only with a temporary debug keystore.
          EOF
          )"

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$UPLOAD_OUTCOME" != "success" ]]; then
            echo "::warning::APK build or Actions artifact upload did not complete successfully; release publishing was not completed."
            {
              echo "## Debug APK Build Status"
              echo ""
              echo "- The debug APK build or artifact upload did not succeed before release publishing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "$RELEASE_OUTCOME" == "success" ]]; then
            RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null || true)"
            if [[ -n "$RELEASE_URL" ]]; then
              echo "Release Tag: ${RELEASE_TAG}"
              echo "Release Title: ${RELEASE_TITLE}"
              echo "GitHub Release URL: ${RELEASE_URL}"
              echo "APK Asset Filename: ${ASSET_NAME}"
              echo "Download the APK directly from the Assets section on the GitHub Release page."
              echo "The GitHub Actions artifact 'app-debug-apk' is also available as a backup."

              {
                echo "## Debug APK Download"
                echo ""
                echo "- **Status:** Debug APK build, Actions artifact upload, and GitHub Release publishing succeeded."
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Direct Release Page:** ${RELEASE_URL}"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
                echo ""
                echo "You can download the APK directly from the **Assets** section on the release page above."
                echo ""
                echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available on this workflow run as a backup."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi

          echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
          {
            echo "## Debug APK Download"
            echo ""
            echo "> **Warning:** Publishing the GitHub Release did not succeed."
            echo ""
            echo "- **APK Build:** Succeeded"
            echo "- **GitHub Actions Artifact:** \`app-debug-apk\` remains available for download from this workflow run."
            echo "- **Backup Instructions:** Open this workflow run's **Artifacts** section and download \`app-debug-apk\`."
          } >> "$GITHUB_STEP_SUMMARY"
          
